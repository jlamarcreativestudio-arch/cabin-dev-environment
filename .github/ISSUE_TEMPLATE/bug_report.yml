name: Bug report
description: Report a reproducible problem in the environment template
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Report the smallest reproducible failure. Do not include credentials or private provider output.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, provider or local host, and snapshot/image identifier if relevant.
      placeholder: Ubuntu 24.04 / amd64 / provider image name
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands and the redacted output needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
